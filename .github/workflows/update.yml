name: Atualizar Dados Verbola

on:
    push:
        branches: [main]
    schedule:
    # De 15 em 15 min: os canais (ondebola) só são atualizados de 3 em 3 horas e a
    # API-Football só é chamada com jogos a decorrer (ver scrape_channels.py e fetch_games.py)
    - cron: "*/15 * * * *"
    workflow_dispatch:

# Evita dois deploys em simultâneo (ex.: cron e push ao mesmo tempo)
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    scrape:
        # Num push só é preciso o build; os dados já estão no repositório
        if: github.event_name != 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            changed: ${{ steps.save.outputs.changed }}
        steps:
            - name: Checkout Repositório
              uses: actions/checkout@v4
            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'
            - name: Instalar Dependências
              run: pip install -r requirements.txt
            - name: Extrair Canais (ondebola)
              # Se o ondebola falhar, continua com os canais da última extração
              continue-on-error: true
              run: python scrape_channels.py
            - name: Obter Jogos (API-Football) e Gerar jogos.json
              env:
                API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
              run: python fetch_games.py
            - name: Guardar Alterações
              id: save
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git add ./data/jogos.json ./data/raw/
                if git diff --cached --quiet; then
                  echo "changed=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                git commit -m "auto: atualização da lista de jogos"
                git pull --rebase
                git push
                echo "changed=true" >> "$GITHUB_OUTPUT"
            - name: Passar dados ao build
              uses: actions/upload-artifact@v4
              with:
                name: data
                path: data/

    build:
        needs: scrape
        # Num push (scrape saltado), no botão manual ou quando os dados mudaram; nunca se o scrape falhou
        if: ${{ !cancelled() && needs.scrape.result != 'failure' && (needs.scrape.result == 'skipped' || github.event_name == 'workflow_dispatch' || needs.scrape.outputs.changed == 'true') }}
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - name: Checkout Repositório
              uses: actions/checkout@v4
            - name: Receber dados do scrape
              if: needs.scrape.result == 'success'
              uses: actions/download-artifact@v4
              with:
                name: data
                path: data/
            - name: Build da página
              run: npm ci && npm run build
            - name: Preparar site
              run: |
                mkdir _site
                cp -r index.html favicon.ico CNAME assets data dist _site/
            - name: Enviar site para o Pages
              uses: actions/upload-pages-artifact@v3
              with:
                path: _site
            - name: Publicar
              id: deploy
              uses: actions/deploy-pages@v4
