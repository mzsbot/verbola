name: Atualizar Dados Verbola

on:
    push:
        branches: [main]
    schedule:
    # Executa de 6 em 6 horas, garantindo a captura matinal em Portugal
    - cron: "0 2,8,14,20 * * *"
    workflow_dispatch:

# Evita dois deploys em simultâneo (ex.: cron e push ao mesmo tempo)
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    scrape:
        # Num push só é preciso o build; os dados já estão no repositório
        if: github.event_name != 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Repositório
              uses: actions/checkout@v4
            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'
            - name: Instalar Dependências
              run: pip install -r requirements.txt
            - name: Executar Scraper
              run: python scraper.py
            - name: Guardar Alterações
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git add ./data/jogos.json
                git commit -m "auto: atualização da lista de jogos" || exit 0
                git push
            - name: Passar dados ao build
              uses: actions/upload-artifact@v4
              with:
                name: data
                path: data/

    build:
        needs: scrape
        # Corre se o scrape teve sucesso ou foi saltado (push), nunca se falhou
        if: ${{ !cancelled() && needs.scrape.result != 'failure' }}
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - name: Checkout Repositório
              uses: actions/checkout@v4
            - name: Receber dados do scrape
              if: needs.scrape.result == 'success'
              uses: actions/download-artifact@v4
              with:
                name: data
                path: data/
            - name: Build da página
              run: npm ci && npm run build
            - name: Preparar site
              run: |
                mkdir _site
                cp -r index.html favicon.ico CNAME assets data dist _site/
            - name: Enviar site para o Pages
              uses: actions/upload-pages-artifact@v3
              with:
                path: _site
            - name: Publicar
              id: deploy
              uses: actions/deploy-pages@v4
