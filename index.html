<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Bola</title>
    
    <!-- Favicons e Ícone para iOS -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="./assets/icon-180.png">
    <link rel="stylesheet" href="./dist/css/app.css" />
</head>
<body class="bg-[#121214] text-zinc-200 font-sans min-h-screen p-2 sm:p-4 select-none cursor-default">

    <!-- Barra de Pesquisa (nova funcionalidade) -->
    <div class="sticky top-0 z-20 -mx-2 sm:-mx-4 px-2 sm:px-4 pt-1 pb-2 bg-[#121214]/90 backdrop-blur">
        <div class="max-w-3xl mx-auto">
            <label class="relative flex items-center">
                <svg 
                    class="absolute left-3 h-4 w-4 text-zinc-500 pointer-events-none" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2.2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="7"/>
                    <path d="m20 20-3.5-3.5"/>
                </svg>
                <input 
                    id="search-input" 
                    type="search" 
                    autocomplete="off" 
                    spellcheck="false"
                    placeholder="Pesquisar equipa, competição ou canal..."
                    class="w-full bg-zinc-900/90 border border-zinc-800/80 rounded-lg pl-9 pr-20 py-2.5 text-base sm:text-sm text-zinc-100 placeholder:text-zinc-500 outline-none focus:border-zinc-600 focus:bg-zinc-900 transition-colors"
                >
                <kbd id="search-hint" class="absolute right-3 hidden sm:inline-block text-[10px] font-mono text-zinc-500 border border-zinc-700/60 rounded px-1.5 py-0.5">/</kbd>
                <button 
                    id="search-clear" 
                    type="button" 
                    aria-label="Limpar pesquisa"
                    class="absolute right-2 hidden text-zinc-400 hover:text-zinc-100 text-xs font-semibold uppercase tracking-wider px-2 py-1 rounded hover:bg-zinc-800"
                >
                    Limpar
                </button>
            </label>
            <div id="search-meta" class="hidden mt-1.5 px-1 text-[11px] text-zinc-500"></div>
        </div>
    </div>
    
    <main class="max-w-3xl mx-auto space-y-2" id="games-container">
        <div class="text-center text-zinc-500 mt-10 animate-pulse">A carregar horários...</div>
    </main>

    <script src="./dist/js/games.js"></script>

    <!-- Rodapé Discreto com Contador -->
    <footer class="max-w-3xl mx-auto text-center py-6 text-xs text-zinc-500 select-none">
        <span>Ver Bola</span>
        <span class="mx-2">•</span>
        <span>Visitas únicas: <span id="visitor-count" class="font-mono text-zinc-400">...</span></span>
    </footer>

    <script src="./dist/js/visitors.js"></script> 
</body>
</html>
