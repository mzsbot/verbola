<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verbola</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4">
    <main class="max-w-2xl mx-auto space-y-3" id="games-container">
        <div class="text-center text-gray-400 mt-10">A carregar jogos...</div>
    </main>

    <script>
        function checkIsLive(timeStr, isToday) {
            if (!isToday || !timeStr) return false;
            
            const now = new Date();
            const currentHour = now.getHours();
            const currentMin = now.getMinutes();
            const nowInMins = (currentHour * 60) + currentMin;

            const [gameH, gameM] = timeStr.split(':').map(Number);
            if (isNaN(gameH) || isNaN(gameM)) return false;
            
            const gameTimeInMins = (gameH * 60) + gameM;
            
            // 115 minutos de tolerância (90m jogo + 15m intervalo + 10m descontos)
            return nowInMins >= gameTimeInMins && nowInMins <= (gameTimeInMins + 115);
        }

        async function loadGames() {
            const container = document.getElementById('games-container');
            
            try {
                const response = await fetch(`jogos.json?t=${new Date().getTime()}`);
                const games = await response.json();
                
                if (games.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-400 mt-10">Nenhum jogo encontrado.</div>';
                    return;
                }

                container.innerHTML = games.map(game => {
                    const isLive = checkIsLive(game.time, game.is_today);
                    
                    const borderClass = isLive 
                        ? 'border-red-500 shadow-[0_0_10px_rgba(239,68,68,0.3)]' 
                        : 'border-gray-700';
                        
                    const liveBadge = isLive 
                        ? '<span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded ml-2 animate-pulse">DIRETO</span>' 
                        : '';

                    return `
                    <div class="bg-gray-800 rounded-xl p-4 border ${borderClass} flex flex-col gap-2 transition-all">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center">
                                <span class="bg-gray-700 text-gray-200 text-xs font-bold px-2 py-1 rounded-md">${game.date} - ${game.time}</span>
                                ${liveBadge}
                            </div>
                            <span class="bg-blue-900/50 text-blue-300 border border-blue-800 text-xs px-2 py-1 rounded font-medium">${game.channel}</span>
                        </div>
                        <div class="mt-1">
                            <div class="text-base font-bold text-gray-100">${game.match}</div>
                            <div class="text-xs text-gray-400 mt-1 uppercase tracking-wider">${game.competition}</div>
                        </div>
                    </div>
                    `;
                }).join('');
            } catch (error) {
                container.innerHTML = '<div class="text-center text-red-400 mt-10">Erro ao carregar os dados.</div>';
            }
        }
        
        loadGames();
        setInterval(loadGames, 60000); 
    </script>
</body>
</html>
